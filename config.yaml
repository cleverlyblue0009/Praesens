# PRAESENS configuration. Every tunable lives here, not hardcoded in modules.

probe:
  camera_index: 0
  max_camera_index: 8   # how many indices --list-cameras probes
  n_frames: 200
  luminance_change_threshold: 2.0   # gray-levels; above this counts as "visible change"
  exposure_test_value: -6            # log2 seconds, typical UVC manual exposure range -13..-1
  display_test_seconds: 3.0
  min_acceptable_fps: 30.0

challenge:
  chip_rate_hz: 5.0
  duration_s: 20.0

emitter:
  emitter_enabled: true       # scientific control switch -- false emits constant mid-grey
  base_luminance: 127         # mid-grey, 0-255
  modulation_depth: 100       # +/- swing around base_luminance, 0-255. Raised from 60 on 2026-08-06:
                               # a real gate run scored bonafide=0.692 (need >=0.7) with emitter_off=0.000
                               # (control collapsed correctly) -- the control passing cleanly means the
                               # fix is real, the bonafide score was just short of margin. insufficient_signal
                               # was False (snr_db=5.53, above the 3dB floor) so the adaptive boost never
                               # triggered -- still running at the OLD default depth, not the ceiling below.
                               # Strengthening the base signal, not lowering the 0.7 bar, since that bar is
                               # what the paper's separation claim rests on.
  max_modulation_depth: 110   # ceiling for adaptive depth (Milestone 3), must keep base+/-depth in [0,255]
  border_fraction: 0.25       # fraction of width/height each border edge occupies
  fallback_window_width: 1920
  fallback_window_height: 1080

optical:
  camera_index: 0
  model_path: models/face_landmarker.task
  exposure_value: -3              # log2 seconds. -6 (M0's original) was too dark for MediaPipe to find a
                                   # face at all in this room's actual ambient light (mean luminance ~24/255,
                                   # confirmed via a clean fresh-capture-per-value sweep on 2026-08-06); -3 is
                                   # the darkest/fastest setting in that sweep where a face is reliably found.
                                   # Exposure time directly caps achievable FPS on this camera
                                   # (fps ~= 1/2^exposure_value), so brighter came at a steep frame-rate cost:
                                   # -6..-4.5 ~30fps but no face; -4/-3.5 ~16fps still no face; -3 ~8fps WITH
                                   # a face. If you can add more physical light near the face, retest with
                                   # scripts/probe.py-style exposure sweeps and prefer a less-negative-is-
                                   # unnecessary (faster) value once brightness allows it -- auto_chip_rate
                                   # below exists specifically to keep this from being a hard requirement.
  disable_auto_wb: true
  lock_verification_frames: 15
  lock_verification_max_std: 3.0  # luminance std (gray levels) over verification frames; above -> warn loudly
  roi_margin_frac: 0.06           # fraction of face height, keeps ROIs off eyes/brows/nose/lip boundaries
  detrend_window_s: 1.5
  lag_search_max_ms: 300
  lag_step_ms: 5
  snr_low_cut_hz: 0.3             # signal band is [snr_low_cut_hz, chip_rate_hz] -- an m-sequence's
                                   # power spectrum runs from DC up to the chip rate (sinc^2 main lobe,
                                   # first null at chip_rate_hz), it is not a tone at chip_rate_hz
  snr_resample_rate_hz: 60.0      # uniform grid rate for bandpass filtering (frames aren't evenly spaced)
  snr_floor_db: 3.0
  adaptive_window_s: 3.0          # how much of the session to judge early SNR on before boosting depth
  min_face_confidence: 0.5
  detect_every_n_frames: 2        # run MediaPipe landmark detection every Nth frame; ROI luminance is
                                   # still sampled EVERY frame using the last known box (cheap, must not skip)
  detect_downscale_width: 480     # resize to this width before detection only (0 = disabled); ROI boxes
                                   # still map correctly onto the full-res frame -- landmarks are normalised [0,1]
  min_fps_multiple_of_chip_rate: 6.0  # Nyquist needs >=2x chip_rate_hz; this is a safety margin above that
  auto_chip_rate: true            # turned on 2026-08-06: exposure=-3 (needed for face detection in this
                                   # room) only achieves ~8fps, badly undersampling a fixed 5Hz chip rate
                                   # (~1.6 samples/chip). This picks chip_rate_hz from a pre-flight FPS
                                   # measurement instead of the fixed value above (see
                                   # praesens/challenge.py pick_auto_chip_rate) and lengthens sessions
                                   # accordingly -- turn back off once lighting lets exposure go faster.
  auto_chip_rate_divisor: 6.0     # chosen chip_rate_hz = measured_fps / this, clamped to [0.5, 5.0] Hz
  auto_chip_rate_min_chips: 60    # session duration is lengthened so at least this many chips are emitted

eval:
  logs_dir: logs
  figures_dir: eval/figures
  figure_dpi: 300
  attack_conditions: [replay, swap]   # emitter_off is a control, not an attack -- excluded from ROC/EER

cross_session:
  synthetic_emitter_sample_rate_hz: 100.0  # matches typical measured real emitter redraw rate (~90-130Hz);
                                            # no real redraw log is persisted in session JSON, so the
                                            # challenge is reconstructed as an idealised schedule at this rate
  output_json: eval/cross_session.json

demo:
  rolling_window_s: 6.0        # how much history the live score is computed over
  score_history_s: 30.0        # how much history the score strip shows
  score_threshold: 0.5         # placeholder until eval/summary.json's EER threshold exists from real data
  min_valid_samples: 8         # below this many valid (face-detected) samples in the window, show NO FACE DETECTED
  dashboard_width: 1280        # internal render resolution; scaled to fit the emitter's centre preview slot
  dashboard_height: 800
  border_fraction: 0.14        # thinner than the base emitter default -- more room for a readable dashboard
  min_fps: 15.0
  screenshot_dir: demo/screenshots
  camera_display_name: null    # optional override; falls back to "camera #<index>"
  panel_rolling_window_s: 1.5  # shorter than rolling_window_s -- panel mode trades statistical
                                # power for a fast, visible collapse (REJECT within ~1s of switching)
