# PRAESENS configuration. Every tunable lives here, not hardcoded in modules.

probe:
  camera_index: 0
  max_camera_index: 8   # how many indices --list-cameras probes
  n_frames: 200
  luminance_change_threshold: 2.0   # gray-levels; above this counts as "visible change"
  exposure_test_value: -6            # log2 seconds, typical UVC manual exposure range -13..-1
  display_test_seconds: 3.0
  min_acceptable_fps: 30.0

challenge:
  chip_rate_hz: 5.0
  duration_s: 20.0

emitter:
  emitter_enabled: true       # scientific control switch -- false emits constant mid-grey
  base_luminance: 127         # mid-grey, 0-255
  modulation_depth: 60        # +/- swing around base_luminance, 0-255
  max_modulation_depth: 110   # ceiling for adaptive depth (Milestone 3), must keep base+/-depth in [0,255]
  border_fraction: 0.25       # fraction of width/height each border edge occupies
  fallback_window_width: 1920
  fallback_window_height: 1080

optical:
  camera_index: 0
  model_path: models/face_landmarker.task
  exposure_value: -6              # log2 seconds; whatever Milestone 0 found sticks on this machine
  disable_auto_wb: true
  lock_verification_frames: 15
  lock_verification_max_std: 3.0  # luminance std (gray levels) over verification frames; above -> warn loudly
  roi_margin_frac: 0.06           # fraction of face height, keeps ROIs off eyes/brows/nose/lip boundaries
  detrend_window_s: 1.5
  lag_search_max_ms: 300
  lag_step_ms: 5
  snr_low_cut_hz: 0.3             # signal band is [snr_low_cut_hz, chip_rate_hz] -- an m-sequence's
                                   # power spectrum runs from DC up to the chip rate (sinc^2 main lobe,
                                   # first null at chip_rate_hz), it is not a tone at chip_rate_hz
  snr_resample_rate_hz: 60.0      # uniform grid rate for bandpass filtering (frames aren't evenly spaced)
  snr_floor_db: 3.0
  adaptive_window_s: 3.0          # how much of the session to judge early SNR on before boosting depth
  min_face_confidence: 0.5

eval:
  logs_dir: logs
  figures_dir: eval/figures
  figure_dpi: 300
  attack_conditions: [replay, swap]   # emitter_off is a control, not an attack -- excluded from ROC/EER

demo:
  rolling_window_s: 6.0        # how much history the live score is computed over
  score_history_s: 30.0        # how much history the score strip shows
  score_threshold: 0.5         # placeholder until eval/summary.json's EER threshold exists from real data
  min_valid_samples: 8         # below this many valid (face-detected) samples in the window, show NO FACE DETECTED
  dashboard_width: 1280        # internal render resolution; scaled to fit the emitter's centre preview slot
  dashboard_height: 800
  border_fraction: 0.14        # thinner than the base emitter default -- more room for a readable dashboard
  min_fps: 15.0
  screenshot_dir: demo/screenshots
  camera_display_name: null    # optional override; falls back to "camera #<index>"
  panel_rolling_window_s: 1.5  # shorter than rolling_window_s -- panel mode trades statistical
                                # power for a fast, visible collapse (REJECT within ~1s of switching)
